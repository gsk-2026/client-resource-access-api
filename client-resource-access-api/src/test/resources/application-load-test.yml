name: Client Resource Access Load Test

env:
  LOOPS: 100
  PAUSE_SECONDS: 3

spring:
  application:
    name: client-resource-access-api

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          fetch_size: 100

server:
  port: 8080

logging:
  level:
    root: INFO
