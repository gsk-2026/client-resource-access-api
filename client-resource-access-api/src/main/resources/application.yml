spring:
  application:
    name: client-resource-access-api

  datasource:
    url: ${APP_DB_URL:jdbc:oracle:thin:@10.0.0.252:1521:free}
    username: ${APP_DB_USER:system}
    password: ${APP_DB_PSWD:Sankui2026}
    driver-class-name: ${APP_DB_DRIVER:oracle.jdbc.OracleDriver}

  jpa:
