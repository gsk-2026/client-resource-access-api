spring:
  application:
    name: client-resource-access-api

  datasource:
    url: ${APP_DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE}
    username: ${APP_DB_USER:sa}
    password: ${APP_DB_PSWD:}
    driver-class-name: ${APP_DB_DRIVER:org.h2.Driver}

  jpa:
    database-platform: ${APP_DB_PLATFORM:org.hibernate.dialect.H2Dialect}
    show-sql: false
    hibernate:
      ddl-auto: ${APP_DB_DDL_AUTO:create-drop}
    properties:
      hibernate:
        dialect: ${APP_DB_PLATFORM:org.hibernate.dialect.H2Dialect}
        format_sql: true


management:
  endpoints:
    web:
      exposure:
        include: health,info